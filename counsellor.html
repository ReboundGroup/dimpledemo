    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends

    // opaque contexts — file:// — everything serializes as 'null', where

      resourceBlobs[u] = pageBlob;
      el.src = u + frag;

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        if (ownFrameWindows().indexOf(e.source) < 0) return;

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&

        // Text is accepted only from the direct parent — the document

    setStatus('Unpacking ' + uuids.length + ' assets...');

              const { done, value } = await reader.read();

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {

            (entry.compressed ? toBase64(finalBytes) : entry.data);

          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        }

        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

g:12px 14px!important}\n.c-timers>span:first-child{grid-column:1/-1}\n.c-timers [style*=\"font-size: 20px\"]{font-size:18px!important}\n.c-chat{height:max(440px,calc(100svh - 150px))!important;flex-basis:100%!important}\n.c-chat-log{padding:14px!important}\n.c-bubble{max-width:86%!important}\n.c-composer textarea{min-height:48px}\n.c-side{min-width:0!important;flex:1 1 100%!important}\n.c-side [role=tab]{padding:12px 12px 9px!important}\n.pool-row{grid-template-columns:1fr auto!important;gap:4px 12px!important}\n.pool-row>div{grid-column:1/-1}\n.al-row{grid-template-columns:auto 1fr!important;gap:6px 12px!important}\n.al-row>span:last-child{grid-column:1/-1}\n.c-app .rv-opt{width:44px!important;height:44px!important}\n.c-demo{right:12px!important;bottom:12px!important}\n.c-demo-panel{width:calc(100vw - 24px)!important;max-width:340px;max-height:65svh!important}\n.c-modal{padding:12px!important;align-items:flex-end!important}\n.c-modal>div{padding:20px 18px!important;max-height:88svh!important}\n.c-modal h2{font-size:26px!important}\n.c-toast{bottom:76px!important;width:max-content;max-width:calc(100vw - 32px)!important}\n}\n<\u002Fstyle><\u002Fhelmet>\n\n<sc-if value=\"{{ isAuth }}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"c-auth\" style=\"display:flex;flex-wrap:wrap;min-height:100vh\">\n  <div data-screen-label=\"Auth brand panel\" class=\"c-auth-brand\" style=\"flex:1;min-width:320px;background:#0A2240;padding:48px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:36px;text-align:center\">\n    <div style=\"display:flex;flex-direction:column;align-items:center;gap:18px\"><img src=\"8ead0c17-c516-4c99-baa6-fd048c5db17d\" alt=\"Dimple\" class=\"c-auth-logo\" style=\"width:clamp(220px,22vw,280px);height:auto;display:block\"><span style=\"color:#E8604A;font-size:18px;letter-spacing:.38em;font-weight:700;text-transform:uppercase;padding-left:.38em\">In Counsel<\u002Fspan><\u002Fdiv>\n    <p class=\"c-auth-tag\" style=\"margin:0;font:400 28px/1.2 'DM Serif Display',serif;color:#fff\">Listen, Respond, Support<span style=\"color:#E8604A\">.<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n  <div class=\"c-auth-form\" style=\"flex:1;min-width:320px;display:flex;align-items:center;justify-content:center;padding:48px 24px\">\n    <div style=\"width:100%;max-width:400px;display:flex;flex-direction:column\">\n      <sc-if value=\"{{ isSso }}\" hint-placeholder-val=\"{{ true }}\">\n        <form data-screen-label=\"Sign in · SSO\" sc-camel-on-submit=\"{{ ssoSubmit }}\" style=\"display:flex;flex-direction:column\">\n          <div style=\"font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#A84A39\">Counsellor workspace<\u002Fdiv>\n          <h1 style=\"margin:12px 0 8px;font:400 40px/1.1 'DM Serif Display',serif\">Sign in<\u002Fh1>\n          <p style=\"margin:0 0 28px;color:#3E4C63;font-size:15px;line-height:1.5\">Sign in with your Dimple counsellor account.<\u002Fp>\n          <label for=\"em\" style=\"font-size:14px;font-weight:600;margin-bottom:8px\">Username<\u002Flabel>\n          <input id=\"em\" type=\"email\" sc-camel-auto-complete=\"username\" value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" style=\"min-height:48px;border:1px solid #EFEAE0;border-radius:8px;background:#fff;padding:0 14px;font-size:16px;outline:none;margin-bottom:20px\" style-focus=\"border-color:#0A2240;box-shadow:0 0 0 3px rgba(232,96,74,.3)\">\n          <label for=\"pw\" style=\"font-size:14px;font-weight:600;margin-bottom:8px\">Password<\u002Flabel>\n          <input id=\"pw\" type=\"password\" sc-camel-auto-complete=\"current-password\" value=\"{{ pw }}\" sc-camel-on-change=\"{{ onPw }}\" style=\"min-height:48px;border:1px solid #EFEAE0;border-radius:8px;background:#fff;padding:0 14px;font-size:16px;outline:none;margin-bottom:20px\" style-focus=\"border-color:#0A2240;box-shadow:0 0 0 3px rgba(232,96,74,.3)\">\n          <button type=\"submit\" style=\"min-height:48px;border:none;border-radius:999px;background:#FF9A83;color:#0A2240;font-size:16px;font-weight:600;cursor:pointer\" style-hover=\"background:#F0806A\">Sign in<\u002Fbutton>\n          <sc-if value=\"{{ hasAuthMsg }}\"><p role=\"alert\" style=\"margin:16px 0 0;padding:10px 14px;border-radius:8px;background:#FDEFEA;color:#8A3A2B;font-size:14px\">{{ authMsg }}<\u002Fp><\u002Fsc-if>\n          <p style=\"margin:20px 0 0;font-size:13px;color:#3E4C63;line-height:1.5\">Sign-ins are logged. Sessions lock after {{ idleMin }} minutes idle. Trouble signing in? <a href=\"mailto:support@itsdimple.com\" style=\"color:#0A2240\">Contact support<\u002Fa><\u002Fp>\n        <\u002Fform>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isMfa }}\">\n        <div data-screen-label=\"Sign in · MFA\" style=\"display:flex;flex-direction:column\">\n          <div style=\"font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#A84A39\">Step 2 of 2 · Verify it's you<\u002Fdiv>\n          <h1 style=\"margin:12px 0 8px;font:400 40px/1.1 'DM Serif Display',serif\">Confirm sign-in<\u002Fh1>\n          <p style=\"margin:0 0 22px;color:#3E4C63;font-size:15px;line-height:1.5\">SSO confirmed for <strong style=\"color:#0A2240\">{{ email }}<\u002Fstrong>.<\u002Fp>\n          <div role=\"tablist\" style=\"display:flex;gap:4px;padding:4px;background:#EFEAE0;border-radius:999px;margin-bottom:22px\">\n            <button role=\"tab\" aria-selected=\"{{ isMfaApp }}\" sc-camel-on-click=\"{{ mfaApp }}\" style=\"flex:1;min-height:40px;border:none;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;background:{{ mfaAppBg }}\">Authenticator app<\u002Fbutton>\n            <button role=\"tab\" aria-selected=\"{{ isMfaKey }}\" sc-camel-on-click=\"{{ mfaKey }}\" style=\"flex:1;min-height:40px;border:none;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;background:{{ mfaKeyBg }}\">Passkey<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ isMfaApp }}\" hint-placeholder-val=\"{{ true }}\">\n            <form sc-camel-on-submit=\"{{ verifyCode }}\" style=\"display:flex;flex-direction:column\">\n              <label for=\"code\" style=\"font-size:14px;font-weight:600;margin-bottom:8px\">6-digit code<\u002Flabel>\n              <input id=\"code\" sc-camel-input-mode=\"numeric\" sc-camel-auto-complete=\"one-time-code\" sc-camel-max-length=\"6\" value=\"{{ code }}\" sc-camel-on-change=\"{{ onCode }}\" placeholder=\"000000\" style=\"min-height:52px;border:1px solid #8A8F9C;border-radius:8px;background:#fff;padding:0 14px;font-size:24px;letter-spacing:.4em;outline:none;margin-bottom:20px;font-variant-numeric:tabular-nums\" style-focus=\"border-color:#0A2240;box-shadow:0 0 0 3px rgba(232,96,74,.3)\">\n              <button type=\"submit\" style=\"min-height:48px;border:none;border-radius:999px;background:#FF9A83;color:#0A2240;font-size:16px;font-weight:600;cursor:pointer\" style-hover=\"background:#F0806A\">Verify and continue<\u002Fbutton>\n            <\u002Fform>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ isMfaKey }}\">\n            <div style=\"display:flex;flex-direction:column;gap:16px\">\n              <p style=\"margin:0;font-size:15px;color:#3E4C63;line-height:1.5\">Use Touch ID, Windows Hello or a security key registered to your account.<\u002Fp>\n              <button sc-camel-on-click=\"{{ usePasskey }}\" style=\"min-height:48px;border:none;border-radius:999px;background:#FF9A83;color:#0A2240;font-size:16px;font-weight:600;cursor:pointer\" style-hover=\"background:#F0806A\">{{ passkeyLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasAuthMsg }}\"><p role=\"alert\" style=\"margin:16px 0 0;padding:10px 14px;border-radius:8px;background:#FDEFEA;color:#8A3A2B;font-size:14px\">{{ authMsg }}<\u002Fp><\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ backToSso }}\" style=\"margin-top:22px;background:none;border:none;color:#A84A39;font-size:14px;cursor:pointer;text-decoration:underline\">← Use a different account<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isApp }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"c-app\" style=\"min-height:100vh;background:#FAF7F2\">\n<header class=\"c-hdr\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding:0 24px;min-height:64px;background:#0A2240;color:#fff;position:sticky;top:0;z-index:20\">\n  <div class=\"c-brand\" style=\"display:flex;align-items:center;gap:10px;flex:none\"><img src=\"assets/images/logo-circle.png\" alt=\"\" style=\"width:34px;height:34px;display:block\"><span style=\"font:400 22px/1 'DM Serif Display',serif\">Dimple<span style=\"color:#E8604A\">.<\u002Fspan><\u002Fspan><span class=\"c-tag\" style=\"font-size:11px;letter-spacing:.22em;font-weight:700;color:#E8604A;text-transform:uppercase;margin-left:4px\">In Counsel<\u002Fspan><\u002Fdiv>\n  <nav aria-label=\"Main\" class=\"c-nav\" style=\"display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;align-self:stretch\">\n    <sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"4\">\n      <button sc-camel-on-click=\"{{ n.go }}\" aria-current=\"{{ n.current }}\" style=\"background:none;border:none;border-bottom:3px solid {{ n.border }};cursor:pointer;padding:3px 14px 0;min-height:64px;font-size:15px;white-space:nowrap;color:{{ n.color }};font-weight:{{ n.weight }};display:flex;align-items:center;gap:8px\">{{ n.label }}<sc-if value=\"{{ n.hasBadge }}\"><span style=\"background:{{ n.badgeBg }};color:#0A2240;border-radius:999px;font-size:11px;font-weight:700;padding:2px 8px\">{{ n.badge }}<\u002Fspan><\u002Fsc-if><\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fnav>\n  <div class=\"c-ctrl\" style=\"display:flex;align-items:center;gap:14px;flex:none\">\n    <button sc-camel-on-click=\"{{ toggleSound }}\" aria-pressed=\"{{ sound }}\" style=\"min-height:36px;padding:0 12px;border:1px solid rgba(255,255,255,.4);border-radius:999px;background:none;color:#fff;font-size:12px;font-weight:600;cursor:pointer\"><span class=\"d-only\">{{ soundLabel }}<\u002Fspan><span class=\"m-only\">{{ soundShort }}<\u002Fspan><\u002Fbutton>\n    <div class=\"c-user\" style=\"line-height:1.25;text-align:right\"><div style=\"font-size:14px;font-weight:600\">{{ userName }}<\u002Fdiv><div style=\"font-size:12px;color:rgba(255,255,255,.78)\">{{ userRole }}<\u002Fdiv><\u002Fdiv>\n    <button sc-camel-on-click=\"{{ signOut }}\" style=\"min-height:36px;padding:0 14px;border:none;border-radius:999px;background:#E8604A;color:#0A2240;font-size:13px;font-weight:700;cursor:pointer\">Sign out<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fheader>\n<div class=\"c-rolebar\" style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding:10px 24px;background:#EFEAE0;border-bottom:1px solid #E2DBCD;font-size:13px\">\n  <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\"><span style=\"font-weight:700\">Viewing as<\u002Fspan>\n    <div role=\"radiogroup\" aria-label=\"Role\" style=\"display:flex;gap:2px;padding:3px;background:#fff;border:1px solid #E2DBCD;border-radius:999px\">\n      <sc-for list=\"{{ roles }}\" as=\"r\" hint-placeholder-count=\"3\"><button role=\"radio\" aria-checked=\"{{ r.on }}\" sc-camel-on-click=\"{{ r.go }}\" style=\"border:none;border-radius:999px;padding:0 14px;min-height:32px;cursor:pointer;font-size:13px;font-weight:600;background:{{ r.bg }};color:{{ r.fg }}\">{{ r.label }}<\u002Fbutton><\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;gap:6px 18px;flex-wrap:wrap;color:#3E4C63\"><span>{{ poolLabel }}<\u002Fspan><span>Session locks after {{ idleMin }} min idle<\u002Fspan><span>All activity in this portal is logged<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<main class=\"c-main\" style=\"padding:28px clamp(16px,3vw,40px) 110px;max-width:1480px;margin:0 auto\">\n\n<sc-if value=\"{{ isQueue }}\" hint-placeholder-val=\"{{ true }}\">\n<section data-screen-label=\"Queue\" style=\"display:flex;flex-direction:column;gap:20px\">\n  <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px\">\n    <div><div style=\"font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#A84A39\">Vijayawada pool · {{ onShiftCount }} counsellors on shift<\u002Fdiv><h1 style=\"margin:6px 0 0;font:400 40px/1.05 'DM Serif Display',serif\">Queue<\u002Fh1><p style=\"margin:8px 0 0;color:#3E4C63;font-size:15px\">{{ queueSummary }}<\u002Fp><\u002Fdiv>\n    <div class=\"c-caseload\" style=\"border:1px solid #E2DBCD;border-radius:8px;background:#fff;padding:14px 18px;min-width:280px;display:flex;flex-direction:column;gap:8px\">\n      <div style=\"display:flex;justify-content:space-between;gap:12px;font-size:14px\"><span style=\"font-weight:700\">Caseload<\u002Fspan><span>{{ caseloadLabel }}<\u002Fspan><\u002Fdiv>\n      <div style=\"height:8px;background:#EFEAE0;border-radius:999px;overflow:hidden\"><div style=\"height:100%;width:{{ caseloadPct }};background:{{ caseloadColor }}\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"font-size:12px;color:#3E4C63\">{{ shiftLine }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <sc-if value=\"{{ offShift }}\"><div role=\"status\" style=\"display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:14px 18px;border-radius:8px;background:#EFEAE0;border:1px solid #E2DBCD\"><div><div style=\"font-weight:700\">You're off shift<\u002Fdiv><div style=\"font-size:14px;color:#3E4C63\">You can see the pool but can't claim requests until you go on shift.<\u002Fdiv><\u002Fdiv><button sc-camel-on-click=\"{{ toggleShift }}\" style=\"min-height:44px;padding:0 20px;border:none;border-radius:999px;background:#0A2240;color:#fff;font-size:14px;font-weight:600;cursor:pointer\">Go on shift<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n  <sc-if value=\"{{ capReached }}\"><div role=\"status\" style=\"display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:14px 18px;border-radius:8px;background:#FFF6DE;border:1px solid #E9C766\"><div><div style=\"font-weight:700\">Caseload cap reached · {{ caseloadLabel }}<\u002Fdiv><div style=\"font-size:14px;color:#3E4C63\">Claiming is paused so each member gets proper time. Close or hand over a case to claim again.<\u002Fdiv><\u002Fdiv><button sc-camel-on-click=\"{{ goCases }}\" style=\"min-height:44px;padding:0 20px;border:1px solid #0A2240;border-radius:999px;background:#fff;font-size:14px;font-weight:600;cursor:pointer\">Review my cases<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n  <sc-if value=\"{{ escActive }}\">\n    <div role=\"alert\" style=\"padding:16px 18px;border-radius:8px;background:#fff;border:2px solid #E8604A;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;align-items:center;gap:10px;font-weight:700\"><span style=\"padding:3px 10px;border-radius:999px;background:#E8604A;font-size:12px\">▲ Tier 3<\u002Fspan>Asha-42 wasn't claimed in time<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px 28px\">\n        <sc-for list=\"{{ escSteps }}\" as=\"e\" hint-placeholder-count=\"4\"><div style=\"display:flex;gap:10px;align-items:flex-start;min-width:200px\"><span style=\"flex:none;width:22px;height:22px;border-radius:999px;background:{{ e.dotBg }};font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center\">{{ e.mark }}<\u002Fspan><div><div style=\"font-size:14px;font-weight:600\">{{ e.label }}<\u002Fdiv><div style=\"font-size:12px;color:#3E4C63\">{{ e.sub }}<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <div style=\"border:1px solid #E2DBCD;border-radius:8px;background:#fff;overflow-x:auto\">\n    <div role=\"table\" aria-label=\"Pool requests\" class=\"q-table\" style=\"min-width:1040px\">\n      <div role=\"row\" class=\"q-head\" style=\"display:grid;grid-template-columns:150px minmax(120px,1.2fr) 90px 100px minmax(130px,1fr) 100px 150px 170px;gap:12px;padding:12px 16px;background:#EFEAE0;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase\"><div>Tier<\u002Fdiv><div>Handle<\u002Fdiv><div>Age band<\u002Fdiv><div>Language<\u002Fdiv><div>Institution<\u002Fdiv><div>Waiting<\u002Fdiv><div>Deadline<\u002Fdiv><div><\u002Fdiv><\u002Fdiv>\n      <sc-for list=\"{{ queueRows }}\" as=\"q\" hint-placeholder-count=\"9\">\n        <div role=\"row\" class=\"q-row\" style=\"display:grid;grid-template-columns:150px minmax(120px,1.2fr) 90px 100px minmax(130px,1fr) 100px 150px 170px;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid #E2DBCD;background:{{ q.rowBg }};font-size:15px\">\n          <div class=\"q-tier\"><span style=\"display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:{{ q.tierBg }}\">{{ q.tierIcon }} {{ q.tierShort }}<\u002Fspan><\u002Fdiv>\n          <div class=\"q-handle\" style=\"font-weight:700;font-size:16px\">{{ q.handle }}<\u002Fdiv>\n          <div class=\"q-meta\">{{ q.age }}<\u002Fdiv><div class=\"q-meta\">{{ q.lang }}<\u002Fdiv><div class=\"q-meta\">{{ q.inst }}<\u002Fdiv>\n          <div class=\"q-meta q-wait\" style=\"font-variant-numeric:tabular-nums\">{{ q.wait }}<\u002Fdiv>\n          <div class=\"q-dl\" style=\"display:flex;flex-direction:column\"><span style=\"font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;color:{{ q.dlColor }}\">{{ q.deadline }}<\u002Fspan><span style=\"font-size:11px;color:#3E4C63\">{{ q.dlSub }}<\u002Fspan><\u002Fdiv>\n          <div class=\"q-act\" style=\"display:flex;flex-direction:column;align-items:flex-end;gap:4px\"><button sc-camel-on-click=\"{{ q.claim }}\" disabled=\"{{ q.disabled }}\" title=\"{{ q.reason }}\" style=\"min-height:40px;padding:0 22px;border-radius:999px;border:none;font-weight:700;font-size:14px;cursor:pointer;background:{{ q.btnBg }};color:{{ q.btnFg }}\">Claim<\u002Fbutton><sc-if value=\"{{ q.hasReason }}\"><span style=\"font-size:11px;color:#3E4C63;text-align:right\">{{ q.reason }}<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font-size:13px;color:#3E4C63;line-height:1.5;max-width:780px\">Only handle, age band, language and institution type are shown. Tiers come from automated risk flags and set the order; automation never joins a conversation.<\u002Fp>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isCase }}\">\n<section data-screen-label=\"Case workspace\" style=\"display:flex;flex-direction:column;gap:16px\">\n  <sc-if value=\"{{ isViewer }}\"><div role=\"status\" style=\"display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:14px 18px;border-radius:8px;background:#0A2240;color:#fff\"><div style=\"font-size:14px;line-height:1.5\"><strong>This opening is logged.<\u002Fstrong> {{ viewerText }}<\u002Fdiv><button sc-camel-on-click=\"{{ markActioned }}\" style=\"min-height:44px;padding:0 20px;border:none;border-radius:999px;background:#E8604A;color:#0A2240;font-size:14px;font-weight:700;cursor:pointer\">Mark flag actioned<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n  <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:16px\">\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap\"><span style=\"display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;background:{{ c.tierBg }}\">{{ c.tierIcon }} {{ c.tierLabel }}<\u002Fspan><h1 style=\"margin:0;font:400 36px/1 'DM Serif Display',serif\">{{ c.handle }}<\u002Fh1><\u002Fdiv>\n      <div style=\"font-size:14px;color:#3E4C63\">{{ c.meta }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n      <button sc-camel-on-click=\"{{ openLiaison }}\" style=\"min-height:44px;padding:0 18px;border:1px solid #0A2240;border-radius:999px;background:#fff;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px\" style-hover=\"background:#EFEAE0\">View liaison contacts <span style=\"font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#EFEAE0\">Logged<\u002Fspan><\u002Fbutton>\n      <sc-if value=\"{{ canClose }}\"><button sc-camel-on-click=\"{{ openClose }}\" style=\"min-height:44px;padding:0 20px;border:none;border-radius:999px;background:#0A2240;color:#fff;font-size:14px;font-weight:600;cursor:pointer\" style-hover=\"background:#16345C\">Close case<\u002Fbutton><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <sc-if value=\"{{ c.isT3 }}\">\n    <div role=\"timer\" aria-label=\"Crisis timers\" class=\"c-timers\" style=\"display:flex;flex-wrap:wrap;gap:10px 32px;align-items:center;padding:12px 18px;border-radius:8px;background:#FDEFEA;border:1px solid #F2B5A6;position:sticky;top:64px;z-index:5\">\n      <span style=\"font-weight:700;display:flex;align-items:center;gap:8px\"><span style=\"padding:3px 10px;border-radius:999px;background:#E8604A;font-size:12px\">▲ Tier 3<\u002Fspan>Crisis timers<\u002Fspan>\n      <sc-for list=\"{{ crisisTimers }}\" as=\"t\" hint-placeholder-count=\"4\"><div style=\"display:flex;flex-direction:column\"><span style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8A3A2B;font-weight:700\">{{ t.label }}<\u002Fspan><span style=\"font-size:20px;font-weight:700;font-variant-numeric:tabular-nums\">{{ t.value }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ showSilence }}\"><div role=\"alert\" style=\"display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:14px 18px;border-radius:8px;background:#fff;border:2px solid #E8604A\"><div><div style=\"font-weight:700\">{{ c.handle }} has stopped replying<\u002Fdiv><div style=\"font-size:14px;color:#3E4C63\">Keep the chat open and check in gently. If there's no reply in 30 minutes, move to Pathway B.<\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:14px\"><div style=\"display:flex;flex-direction:column;align-items:flex-end\"><span style=\"font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8A3A2B\">Reply window<\u002Fspan><span style=\"font:400 32px/1 'DM Serif Display',serif;font-variant-numeric:tabular-nums\">{{ silenceLeft }}<\u002Fspan><\u002Fdiv><sc-if value=\"{{ noPathway }}\"><button sc-camel-on-click=\"{{ startB }}\" style=\"min-height:44px;padding:0 18px;border:none;border-radius:999px;background:#E8604A;color:#0A2240;font-size:14px;font-weight:700;cursor:pointer\">Start Pathway B<\u002Fbutton><\u002Fsc-if><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start\">\n    <div class=\"c-chat\" style=\"flex:1 1 560px;min-width:0;border:1px solid #E2DBCD;border-radius:8px;background:#fff;display:flex;flex-direction:column;height:max(520px,calc(100vh - 360px))\">\n      <div style=\"display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:14px 18px;border-bottom:1px solid #E2DBCD\"><div style=\"font-weight:700\">Secure chat with {{ c.handle }}<\u002Fdiv><div style=\"font-size:12px;color:#3E4C63\">This conversation is logged · watermarked · copy and export disabled<\u002Fdiv><\u002Fdiv>\n      <div style=\"flex:1;min-height:0;position:relative\">\n        <div ref=\"{{ chatRef }}\" sc-camel-on-copy=\"{{ blockCopy }}\" aria-live=\"polite\" class=\"c-chat-log\" style=\"position:absolute;inset:0;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;background:#FBFAF7;user-select:none\">\n          <sc-for list=\"{{ msgs }}\" as=\"m\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;flex-direction:column;align-items:{{ m.align }};gap:4px\">\n              <div class=\"c-bubble\" style=\"max-width:72%;padding:10px 14px;border-radius:{{ m.radius }};background:{{ m.bg }};color:{{ m.fg }};border:1px solid {{ m.bd }};font-size:{{ m.size }};line-height:1.5;text-wrap:pretty\">{{ m.text }}<\u002Fdiv>\n              <span style=\"font-size:11px;color:#3E4C63\">{{ m.meta }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ typing }}\"><div style=\"font-size:13px;color:#3E4C63\">{{ c.handle }} is typing…<\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n        <div aria-hidden=\"true\" style=\"position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2\"><div style=\"position:absolute;inset:-50%;display:flex;flex-wrap:wrap;gap:70px 90px;align-content:center;justify-content:center;transform:rotate(-24deg)\"><sc-for list=\"{{ wm }}\" as=\"w\" hint-placeholder-count=\"30\"><span style=\"font-size:13px;font-weight:700;color:rgba(10,34,64,.07);white-space:nowrap\">{{ w }}<\u002Fspan><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ canChat }}\">\n        <form sc-camel-on-submit=\"{{ send }}\" class=\"c-composer\" style=\"display:flex;gap:8px;padding:12px;border-top:1px solid #E2DBCD\">\n          <textarea value=\"{{ draft }}\" sc-camel-on-change=\"{{ onDraft }}\" sc-camel-on-key-down=\"{{ draftKey }}\" rows=\"2\" placeholder=\"Write to {{ c.handle }}…\" aria-label=\"Message\" style=\"flex:1;resize:none;border:1px solid #8A8F9C;border-radius:8px;padding:10px 12px;font-size:15px;outline:none\" style-focus=\"border-color:#0A2240;box-shadow:0 0 0 3px rgba(232,96,74,.3)\"><\u002Ftextarea>\n          <button type=\"submit\" style=\"min-width:96px;padding:0 20px;border:none;border-radius:8px;background:#0A2240;color:#fff;font-size:15px;font-weight:600;cursor:pointer\" style-hover=\"background:#16345C\">Send<\u002Fbutton>\n        <\u002Fform>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ readOnlyChat }}\"><div style=\"padding:14px 18px;border-top:1px solid #E2DBCD;font-size:13px;color:#3E4C63\">Read-only. The Clinical Director acts on the flag and doesn't message the member.<\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div class=\"c-side\" style=\"flex:0 1 380px;min-width:300px;display:flex;flex-direction:column;gap:16px\">\n      <sc-if value=\"{{ c.isT3 }}\">\n        <div style=\"border:1px solid #E2DBCD;border-radius:8px;background:#fff;padding:16px 18px;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px\"><div style=\"font:400 22px/1.2 'DM Serif Display',serif\">Crisis pathway<\u002Fdiv><span style=\"font-size:13px;font-variant-numeric:tabular-nums;color:#3E4C63\">{{ pwHead }}<\u002Fspan><\u002Fdiv>\n          <sc-if value=\"{{ noPathway }}\">\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <button sc-camel-on-click=\"{{ startA }}\" disabled=\"{{ cantEdit }}\" style=\"text-align:left;border:1px solid #0A2240;border-radius:8px;background:#fff;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px\" style-hover=\"background:#FAF7F2\"><span style=\"font-weight:700\">Start Pathway A<\u002Fspan><span style=\"font-size:13px;color:#3E4C63;line-height:1.4\">Member consents and writes what they want shared with their campus liaison.<\u002Fspan><\u002Fbutton>\n              <button sc-camel-on-click=\"{{ startB }}\" disabled=\"{{ cantEdit }}\" style=\"text-align:left;border:1px solid #8A8F9C;border-radius:8px;background:#fff;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px\" style-hover=\"background:#FAF7F2\"><span style=\"font-weight:700\">Start Pathway B<\u002Fspan><span style=\"font-size:13px;color:#3E4C63;line-height:1.4\">No consent, or the member is unreachable. Welfare check without sharing chat content.<\u002Fspan><\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasPathway }}\">\n            <ol style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column\">\n              <sc-for list=\"{{ pwSteps }}\" as=\"s\" hint-placeholder-count=\"4\">\n                <li style=\"display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-top:1px solid #EFEAE0\">\n                  <span style=\"width:26px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:{{ s.dotBg }};color:{{ s.dotFg }}\">{{ s.mark }}<\u002Fspan>\n                  <div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:14px;font-weight:600\">{{ s.label }}<\u002Fspan><span style=\"font-size:12px;color:{{ s.subColor }};font-variant-numeric:tabular-nums\">{{ s.sub }}<\u002Fspan><\u002Fdiv>\n                <\u002Fli>\n              <\u002Fsc-for>\n            <\u002Fol>\n            <sc-if value=\"{{ pwA0 }}\">\n              <div style=\"display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:8px;background:#FAF7F2\">\n                <label style=\"display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ consent }}\" sc-camel-on-change=\"{{ toggleConsent }}\" style=\"width:18px;height:18px;margin:2px 0 0;accent-color:#0A2240\"><span>{{ c.handle }} has said in chat that they consent to their liaison being told.<\u002Fspan><\u002Flabel>\n                <label for=\"share\" style=\"font-size:13px;font-weight:600\">What {{ c.handle }} chose to share, in their words<\u002Flabel>\n                <textarea id=\"share\" value=\"{{ shareDraft }}\" sc-camel-on-change=\"{{ onShare }}\" rows=\"3\" placeholder=\"Paste or type exactly what the member wrote\" style=\"resize:vertical;border:1px solid #8A8F9C;border-radius:8px;padding:10px 12px;font-size:14px;outline:none;background:#fff\"><\u002Ftextarea>\n                <button sc-camel-on-click=\"{{ notifyLiaison }}\" disabled=\"{{ cantNotify }}\" style=\"min-height:44px;border:none;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;background:{{ notifyBg }};color:{{ notifyFg }}\">Notify liaison<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ pwShowShared }}\"><div style=\"padding:12px 14px;background:#EFEAE0;border-radius:8px;font-size:14px;line-height:1.5\"><div style=\"font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px\">Shared with liaison, in the member's words<\u002Fdiv>“{{ pwShared }}”<\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{ pwB0 }}\"><button sc-camel-on-click=\"{{ logAttempt }}\" style=\"min-height:44px;border:1px solid #0A2240;border-radius:999px;background:#fff;font-size:14px;font-weight:600;cursor:pointer\">{{ attemptLabel }}<\u002Fbutton><\u002Fsc-if>\n            <sc-if value=\"{{ pwWaitAck }}\"><div style=\"font-size:13px;color:#3E4C63\">Waiting for the liaison to acknowledge…<\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{ pwConfirm }}\"><button sc-camel-on-click=\"{{ confirmContact }}\" style=\"min-height:44px;border:none;border-radius:999px;background:#E8604A;color:#0A2240;font-size:14px;font-weight:700;cursor:pointer\">{{ confirmLabel }}<\u002Fbutton><\u002Fsc-if>\n            <sc-if value=\"{{ pwComplete }}\"><div style=\"padding:10px 14px;border-radius:8px;background:#DDF5EA;font-size:14px\">Pathway complete. Record any referral, then close the case when ready.<\u002Fdiv><\u002Fsc-if>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"border:1px solid #E2DBCD;border-radius:8px;background:#fff;display:flex;flex-direction:column\">\n        <div role=\"tablist\" style=\"display:flex;overflow-x:auto;border-bottom:1px solid #E2DBCD\">\n          <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"5\"><button role=\"tab\" aria-selected=\"{{ t.on }}\" sc-camel-on-click=\"{{ t.go }}\" style=\"flex:1 0 auto;background:none;border:none;border-bottom:3px solid {{ t.bd }};padding:12px 12px 9px;font-size:13px;font-weight:600;cursor:pointer;color:{{ t.fg }};white-space:nowrap\">{{ t.label }}<\u002Fbutton><\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"padding:16px 18px;display:flex;flex-direction:column;gap:12px;max-height:560px;overflow-y:auto\">\n          <sc-if value=\"{{ tabNotes }}\" hint-placeholder-val=\"{{ true }}\">\n            <p style=\"margin:0;font-size:12px;color:#3E4C63\">Support notes are visible to whoever holds this case.<\u002Fp>\n            <sc-for list=\"{{ c.notes }}\" as=\"x\" hint-placeholder-count=\"1\"><div style=\"padding:10px 12px;background:#FAF7F2;border-radius:8px;font-size:14px;line-height:1.45\"><div>{{ x.text }}<\u002Fdiv><div style=\"font-size:11px;color:#3E4C63;margin-top:4px\">{{ x.meta }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n            <sc-if value=\"{{ canEdit }}\"><textarea value=\"{{ noteDraft }}\" sc-camel-on-change=\"{{ onNote }}\" rows=\"3\" aria-label=\"Support note\" placeholder=\"Add a support note\" style=\"resize:vertical;border:1px solid #8A8F9C;border-radius:8px;padding:10px 12px;font-size:14px;outline:none\"><\u002Ftextarea><button sc-camel-on-click=\"{{ addNote }}\" style=\"min-height:44px;border:1px solid #0A2240;border-radius:999px;background:#fff;font-size:14px;font-weight:600;cursor:pointer\">Add note<\u002Fbutton><\u002Fsc-if>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ tabRefs }}\">\n            <sc-if value=\"{{ c.hasRefs }}\"><sc-for list=\"{{ c.refs }}\" as=\"r\" hint-placeholder-count=\"1\"><div style=\"padding:10px 12px;border:1px solid #E2DBCD;border-radius:8px;font-size:14px\"><div style=\"font-weight:700\">{{ r.service }}<\u002Fdiv><div style=\"font-size:13px;color:#3E4C63\">{{ r.type }} · {{ r.date }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fsc-if>\n            <sc-if value=\"{{ c.noRefs }}\"><p style=\"margin:0;font-size:13px;color:#3E4C63\">No referrals recorded yet.<\u002Fp><\u002Fsc-if>\n
