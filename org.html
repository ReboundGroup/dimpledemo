document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

amily:'DM Sans',system-ui,sans-serif;color:#0A2240;-webkit-font-smoothing:antialiased;line-height:1.55}\nnav::-webkit-scrollbar{display:none}\n@media (max-width:1180px){[data-pilot]{display:none!important}}\n:focus-visible{outline:2px solid #A84A39;outline-offset:2px}\n*{box-sizing:border-box}\na{color:#A84A39;text-decoration:none;transition:color 180ms}\na:hover{color:#0A2240;text-decoration:underline}\ninput,select,textarea,button{font-family:inherit}\nbutton:disabled{cursor:not-allowed}\n@media (max-width:760px){\n[data-m=authbrand]{flex:1 1 100%!important;min-width:0!important;min-height:0!important;padding:28px 20px 26px!important;gap:16px!important}\n[data-m=authbrand] img{width:120px!important}\n[data-m=authkick]{font-size:14px!important}\n[data-m=authbrand] h1>span{font-size:22px!important}\n[data-m=authside]{flex:1 1 100%!important;min-width:0!important;padding:32px 20px 44px!important}\n[data-m=topwrap]{display:contents!important}\n[data-m=bandA],[data-m=bandB]{position:sticky;top:0;z-index:31;padding:14px 16px!important;gap:12px!important}\n[data-m=bandleft]{flex-direction:row!important;align-items:baseline!important;gap:10px;min-width:0!important;padding-right:0!important;border-right:none!important}\n[data-m=bandleft]>span:last-child{font-size:26px!important}\n[data-m=bandtext]{flex:1 1 100%!important;min-width:0!important}\n[data-m=bandtext]>div:nth-child(2){font-size:17px!important}\n[data-m=bandtext]>div:nth-child(3){font-size:14px!important}\n[data-m=bandA]~[data-m=bandB]{position:static}\n[data-m=bandbtns]{flex:1 1 100%;flex-direction:row!important;align-items:center!important;gap:12px!important}\n[data-m=bandbtns]>button:first-child{flex:1}\n[data-m=demomenu]>div{padding:12px!important}\n[data-m=hdr]{padding:0 16px!important;gap:0 12px!important;min-height:56px!important}\n[data-m=hdrbrand]{flex:1 1 auto!important;min-height:56px;order:1}\n[data-m=hdrbrand] img{width:28px!important;height:28px!important}\n[data-m=hdrkick],[data-m=persona]{display:none!important}\n[data-m=hdrright]{order:2;gap:8px!important}\n[data-m=hdrnav]{order:3;flex:1 1 100%!important;margin:0 -16px;padding:0 6px;border-top:1px solid rgba(255,255,255,.12)}\n[data-m=hdrnav] button{min-height:48px!important;padding:3px 12px 0!important}\n[data-m=viewbar]{padding:10px 16px!important;position:relative}\n[data-m=demowrap]{position:static!important}\n[data-m=demomenu]{top:calc(100% + 4px)!important;left:16px!important;right:16px!important;width:auto!important}\n[data-m=main]{padding:20px 16px 48px!important;gap:16px!important}\n[data-m=g1]{grid-template-columns:minmax(0,1fr)!important}\n[data-m=g2]{grid-template-columns:repeat(2,minmax(0,1fr))!important;row-gap:14px!important}\n[data-m=wizbar]{padding:0 16px!important}\n[data-m=wizbody]{padding:24px 16px 48px!important;gap:22px!important}\n[data-m=card28]{padding:20px 18px!important}\n[data-m=ovl]{padding:12px!important}\n[data-m=dlg]{padding:20px!important;border-radius:16px!important;max-height:calc(100vh - 24px)!important;max-height:calc(100dvh - 24px)!important;overflow:auto!important}\n[data-m=postercard]{padding:20px 16px!important}\n[data-m=idlebtns]{flex-wrap:wrap;justify-content:center}\nh1[style*=\"font-size: 44px\"]{font-size:32px!important}\n[style*=\"font-size: 40px\"]{font-size:30px!important}\n[style*=\"font-size: 34px\"]{font-size:28px!important}\n[style*=\"font-size: 30px\"]{font-size:26px!important}\n[style*=\"font-size: 11px\"],[style*=\"font-size: 12px\"]{font-size:13px!important}\ninput[style*=\"font-size: 15px\"],select,textarea{font-size:16px!important}\nbutton{min-height:44px!important;min-width:44px!important}\na[href=\"#\"]{display:inline-flex;align-items:center;min-height:44px}\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<sc-if value=\"{{ isAuth }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;min-height:100vh;flex-wrap:wrap\">\n  <div data-screen-label=\"Auth brand panel\" data-m=\"authbrand\" style=\"flex:0 0 44%;min-width:320px;background:#0A2240;padding:38px 56px 36px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:40px;text-align:center;min-height:100vh\">\n    <a href=\"Home.dc.html\" title=\"Back to home\" style=\"flex:none;display:flex;flex-direction:column;align-items:center;gap:18px;text-decoration:none\"><img src=\"1a9f42b4-9a3d-40d2-9604-7f0569a1d102\" alt=\"Dimple In House\" role=\"img\" aria-label=\"Dimple In House\" style=\"width:280px;height:auto;display:block\"><span data-m=\"authkick\" style=\"color:#FF9A83;font-size:20px;line-height:1;letter-spacing:.38em;font-weight:700;text-transform:uppercase;padding-left:.38em\">In House<\u002Fspan><\u002Fa>\n    <h1 style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:56px;line-height:1.08;color:#fff;text-wrap:balance;display:flex;flex-direction:column;gap:14px\"><span style=\"color:#fff;font-size:28px;line-height:1.2\">Setup, Access, Support<span style=\"color:#FF9A83\">.<\u002Fspan><\u002Fspan><\u002Fh1>\n  <\u002Fdiv>\n\n  <div data-m=\"authside\" style=\"flex:1;min-width:320px;display:flex;align-items:center;justify-content:center;padding:48px 24px;background:#FAF7F2\">\n    <div style=\"width:100%;max-width:384px\">\n      <sc-if value=\"{{ showLogin }}\" hint-placeholder-val=\"{{ true }}\">\n        <form data-screen-label=\"Sign in · SSO\" sc-camel-on-submit=\"{{ signIn }}\" style=\"display:flex;flex-direction:column\">\n          <div style=\"color:#A84A39;font-size:11px;letter-spacing:.22em;font-weight:600;text-transform:uppercase\">ORGANISATION PORTAL<\u002Fdiv>\n          <h2 style=\"margin:14px 0 8px;font-family:'DM Serif Display',serif;font-weight:400;font-size:40px;line-height:1.1\">Sign in to continue<\u002Fh2>\n          <p style=\"margin:0 0 32px;color:#5B6A80;font-size:15px\">Enter your work email and we’ll send you to your {{ t.org }}’s single sign-on.<\u002Fp>\n          <label style=\"font-size:14px;font-weight:500;margin-bottom:8px\">Work email<\u002Flabel>\n          <input type=\"email\" value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" style=\"transition:all 180ms ease;height:48px;border-radius:4px;border:1px solid #E2DBCD;background:#fff;padding:0 14px;font-size:16px;color:#0A2240;outline:none;margin-bottom:20px\" style-focus=\"border-color:#FF9A83;box-shadow:0 0 0 3px rgba(255,154,131,.2)\" style-hover=\"border-color:#CFC6B5\">\n          <sc-if value=\"{{ hasAuthErr }}\"><div style=\"color:#A84A39;font-size:13px;margin:-8px 0 12px\">{{ authErr }}<\u002Fdiv><\u002Fsc-if>\n          <button type=\"submit\" style=\"transition:all 180ms ease;height:48px;border:none;border-radius:999px;background:#FF9A83;color:#0A2240;font-size:16px;font-weight:600;cursor:pointer\" style-hover=\"background:#F0806A;transform:translateY(-1px);box-shadow:0 6px 16px rgba(255,154,131,.35)\" style-active=\"transform:scale(.97)\">Continue with SSO<\u002Fbutton>\n          <p style=\"margin:18px 0 0;text-align:center;font-size:13px;color:#5B6A80\">Every sign-in is logged. Need help? <a href=\"mailto:support@itsdimple.com\" style=\"color:#0A2240;font-weight:600\">Contact Support<\u002Fa><\u002Fp>\n          <p style=\"margin:28px 0 0;text-align:center;font-size:12px;color:#5B6A80\">portal.itsdimple.com<\u002Fp>\n        <\u002Fform>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showMfa }}\">\n        <form data-screen-label=\"Sign in · MFA\" sc-camel-on-submit=\"{{ verify }}\" style=\"display:flex;flex-direction:column\">\n          <div style=\"color:#A84A39;font-size:11px;letter-spacing:.22em;font-weight:600;text-transform:uppercase\">STEP 2 OF 2<\u002Fdiv>\n          <h2 style=\"margin:14px 0 8px;font-family:'DM Serif Display',serif;font-weight:400;font-size:40px;line-height:1.1\">Verify it’s you<\u002Fh2>\n          <p style=\"margin:0 0 24px;color:#5B6A80;font-size:15px\">Signed in as <strong style=\"color:#0A2240;font-weight:600\">{{ email }}<\u002Fstrong>. Choose how to confirm.<\u002Fp>\n          <div style=\"display:flex;gap:4px;padding:4px;border:1px solid #E2DBCD;border-radius:999px;background:#fff;margin-bottom:24px\">\n            <sc-for list=\"{{ mfaOpts }}\" as=\"o\" hint-placeholder-count=\"2\"><button type=\"button\" sc-camel-on-click=\"{{ o.pick }}\" style=\"transition:all 180ms ease;flex:1;height:40px;border:none;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;background:{{ o.bg }};color:{{ o.color }}\">{{ o.label }}<\u002Fbutton><\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ mfaApp }}\">\n            <div style=\"display:flex;flex-direction:column\">\n              <label style=\"font-size:14px;font-weight:500;margin-bottom:8px\">6-digit code from your authenticator app<\u002Flabel>\n              <input inputmode=\"numeric\" maxlength=\"6\" value=\"{{ otp }}\" sc-camel-on-change=\"{{ onOtp }}\" style=\"transition:all 180ms ease;height:56px;border-radius:4px;border:1px solid #E2DBCD;background:#fff;padding:0 14px;font-size:24px;letter-spacing:.4em;color:#0A2240;outline:none;margin-bottom:20px;text-align:center\" style-focus=\"border-color:#FF9A83;box-shadow:0 0 0 3px rgba(255,154,131,.2)\" style-hover=\"border-color:#CFC6B5\">\n              <sc-if value=\"{{ hasAuthErr }}\"><div style=\"color:#A84A39;font-size:13px;margin:-8px 0 12px\">{{ authErr }}<\u002Fdiv><\u002Fsc-if>\n              <button type=\"submit\" style=\"transition:all 180ms ease;height:48px;border:none;border-radius:999px;background:#FF9A83;color:#0A2240;font-size:16px;font-weight:600;cursor:pointer\" style-hover=\"background:#F0806A;transform:translateY(-1px);box-shadow:0 6px 16px rgba(255,154,131,.35)\" style-active=\"transform:scale(.97)\">Verify and sign in<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ mfaPasskey }}\">\n            <div style=\"display:flex;flex-direction:column;gap:14px\">\n              <div style=\"background:#fff;border:1px solid #EFEAE0;border-radius:8px;padding:20px;font-size:14px;color:#2A3D57\">Use the passkey saved on this device or your phone. Your browser will ask you to confirm with your fingerprint, face or screen lock.<\u002Fdiv>\n              <button type=\"button\" sc-camel-on-click=\"{{ usePasskey }}\" disabled=\"{{ passkeyWait }}\" style=\"transition:all 180ms ease;height:48px;border:none;border-radius:999px;background:#FF9A83;color:#0A2240;font-size:16px;font-weight:600;cursor:pointer\" style-hover=\"background:#F0806A;transform:translateY(-1px);box-shadow:0 6px 16px rgba(255,154,131,.35)\" style-active=\"transform:scale(.97)\">{{ passkeyLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <a href=\"#\" sc-camel-on-click=\"{{ backToLogin }}\" style=\"margin-top:22px;text-align:center;font-size:14px;color:#A84A39\">← Use a different account<\u002Fa>\n        <\u002Fform>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showExpired }}\">\n        <div data-screen-label=\"Session expired\" style=\"display:flex;flex-direction:column\">\n          <div style=\"color:#A84A39;font-size:11px;letter-spacing:.22em;font-weight:600;text-transform:uppercase\">SESSION ENDED<\u002Fdiv>\n          <h2 style=\"margin:14px 0 8px;font-family:'DM Serif Display',serif;font-weight:400;font-size:40px;line-height:1.1\">Your session expired<\u002Fh2>\n          <p style=\"margin:0 0 28px;color:#5B6A80;font-size:15px;line-height:1.5\">You were signed out after 15 minutes without activity, to keep {{ t.member }} information safe. Anything you’d saved is still here.<\u002Fp>\n          <button sc-camel-on-click=\"{{ backToLogin }}\" style=\"transition:all 180ms ease;height:48px;border:none;border-radius:999px;background:#FF9A83;color:#0A2240;font-size:16px;font-weight:600;cursor:pointer\" style-hover=\"background:#F0806A;transform:translateY(-1px);box-shadow:0 6px 16px rgba(255,154,131,.35)\" style-active=\"transform:scale(.97)\">Sign in again<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv :200px\">\n                <svg sc-camel-view-box=\"0 0 100 100\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position:absolute;inset:0;width:100%;height:100%;overflow:visible\">\n                  <line x1=\"0\" y1=\"0\" x2=\"100\" y2=\"0\" stroke=\"#EFEAE0\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n                  <line x1=\"0\" y1=\"25\" x2=\"100\" y2=\"25\" stroke=\"#EFEAE0\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n                  <line x1=\"0\" y1=\"50\" x2=\"100\" y2=\"50\" stroke=\"#EFEAE0\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n                  <line x1=\"0\" y1=\"75\" x2=\"100\" y2=\"75\" stroke=\"#EFEAE0\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n                  <line x1=\"0\" y1=\"100\" x2=\"100\" y2=\"100\" stroke=\"#E2DBCD\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n                  <sc-for list=\"{{ series }}\" as=\"s\"><path d=\"{{ s.d }}\" fill=\"none\" stroke=\"{{ s.color }}\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><\u002Fsc-for>\n                <\u002Fsvg>\n              <\u002Fdiv>\n              <div><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font-size:12px;color:#5B6A80\"><span>W1<\u002Fspan><span>W2<\u002Fspan><span>W3<\u002Fspan><span>W4<\u002Fspan><span>W5<\u002Fspan><span>W6<\u002Fspan><span>W7<\u002Fspan><span>W8<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <sc-for list=\"{{ legend }}\" as=\"g\" hint-placeholder-count=\"3\"><div style=\"display:flex;align-items:center;gap:10px;font-size:14px\"><span style=\"width:18px;height:3px;border-radius:2px;background:{{ g.color }}\"><\u002Fspan><span style=\"font-weight:600\">{{ g.name }}<\u002Fspan><span style=\"color:{{ g.noteColor }}\">{{ g.note }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;b                   <\u002Fsc-for>\n                <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n            <div style=\"font-size:13px;color:#2A3D57;line-height:1.5\">Groups under 30 users aren’t shown. Any cell under 5 reads “fewer than 5”.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid #EFEAE0;border-radius:8px;padding:24px\">\n            <div style=\"color:#A84A39;font-size:17px;font-weight:500;margin-bottom:18px\">Wellbeing distribution · reportable groups<\u002Fdiv>\n            <div style=\"display:flex;height:14px;border-radius:999px;overflow:hidden;margin-bottom:18px\"><sc-for list=\"{{ dist }}\" as=\"d\"><div style=\"flex:{{ d.flex }};background:{{ d.color }}\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n            <div data-m=\"g2\" style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px\">\n              <sc-for list=\"{{ dist }}\" as=\"d\" hint-placeholder-count=\"4\"><div><div style=\"font-size:13px;color:#5B6A80;display:flex;align-items:center;gap:6px\"><span style=\"width:8px;height:8px;border-radius:50%;background:{{ d.color }}\"><\u002Fspan>{{ d.label }}<\u002Fdiv><div style=\"font-size:18px;font-weight:600;margin-top:6px\">{{ d.pct }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid #EFEAE0;border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:16px\">\n            <span style=\"color:#A84A39;font-size:17px;font-weight:500\">Five SUKHA dimensions · reportable groups<\u002Fspan>\n            <sc-for list=\"{{ dims }}\" as=\"d\" hint-placeholder-count=\"5\"><div><div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px\"><span style=\"font-size:15px;font-weight:600\">{{ d.name }}<\u002Fspan><span style=\"font-family:'DM Serif Display',serif;font-size:22px\">{{ d.v }}<\u002Fspan><\u002Fdiv><div style=\"height:7px;background:#EFEAE0;border-radius:999px\"><div style=\"width:{{ d.pct }};height:100%;background:{{ d.color }};border-radius:999px\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ pCrisis }}\">\n      <div data-screen-label=\"Crisis notices\" style=\"display:flex;flex-direction:column;gap:18px\">\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <span style=\"display:inline-flex;align-self:flex-start;align-items:center;gap:6px;font-size:12px;color:#2A3D57;background:#EFEAE0;border-radius:999px;padding:4px 12px\"><span style=\"width:6px;height:6px;border-radius:50%;background:#A84A39\"><\u002Fspan>Viewing this page is logged<\u002Fspan>\n          <div><h1 style=\"margin:0 0 10px;font-family:'DM Serif Display',serif;font-weight:400;font-size:44px;line-height:1.05;letter-spacing:-.015em\">Crisis notices<\u002Fh1><p style=\"margin:0;font-size:15px;color:#2A3D57\">Notices for you as an Escalation Liaison. {{ t.Members }} are known only by their pseudonym.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ bandOn }}\">\n          <div style=\"background:#FFF0EC;border:2px solid #A84A39;border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:14px\">\n            <div style=\"display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center\"><span style=\"color:#A84A39;font-size:11px;letter-spacing:.22em;font-weight:700;flex:1;min-width:0\">{{ band.kicker }}<\u002Fspan><span style=\"font-size:13px;font-weight:600;white-space:nowrap\">{{ band.leftTop }} · {{ band.leftBig }}<\u002Fspan><\u002Fdiv>\n            <div style=\"font-family:'DM Serif Display',serif;font-size:30px;line-height:1.15\">{{ band.title }}<\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid #FFD6CC;border-radius:8px;padding:16px 18px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:12px;color:#5B6A80\">{{ band.bodyLabel }}<\u002Fspan><span style=\"font-size:16px;line-height:1.5\">{{ band.body }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:center\">\n              <button sc-camel-on-click=\"{{ band.act }}\" style=\"transition:all 180ms ease;height:48px;padding:0 24px;border:none;border-radius:999px;background:#A84A39;color:#fff;font-size:15px;font-weight:600;cursor:pointer\" style-hover=\"transform:translateY(-1px);box-shadow:0 6px 16px rgba(168,74,57,.35)\" style-active=\"transform:scale(.97)\">{{ band.btn }}<\u002Fbutton>\n              <span style=\"font-size:13px;color:#2A3D57\">{{ band.note }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ noNotice }}\">\n          <div style=\"background:#fff;border:1px dashed #E2DBCD;border-radius:8px;padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center\">\n            <div style=\"font-family:'DM Serif Display',serif;font-size:26px\">No active notices<\u002Fdiv>\n            <p style=\"margin:0;max-width:480px;font-size:15px;color:#2A3D57\">When a notice arrives you’ll hear a soft chime and see a full-width alert, wherever you are in the portal.<\u002Fp>\n            <div style=\"display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px\">\n              <button sc-camel-on-click=\"{{ triggerA }}\" style=\"transition:all 180ms ease;height:48px;padding:0 24px;border:1px solid #E2DBCD;border-radius:999px;background:#fff;color:#0A2240;font-size:15px;font-weight:500;cursor:pointer\" style-hover=\"background:#FFF0EC;border-color:#FF9A83\" style-active=\"transform:scale(.97)\">Demo: Pathway A notice<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ triggerB }}\" style=\"transition:all 180ms ease;height:48px;padding:0 24px;border:1px solid #E2DBCD;border-radius:999px;background:#fff;color:#0A2240;font-size:15px;font-we 0px;margin-top:6px\">\n        <button type=\"button\" sc-camel-on-click=\"{{ closeModal }}\" style=\"transition:all 180ms ease;height:48px;padding:0 24px;border:1px solid #E2DBCD;border-radius:999px;background:#fff;color:#0A2240;font-size:15px;font-weight:500;cursor:pointer\" style-hover=\"background:#FFF0EC;border-color:#FF9A83\" style-active=\"transform:scale(.97)\">Cancel<\u002Fbutton>\n        <button type=\"submit\" style=\"transition:all 180ms ease;height:48px;padding:0 24px;border:none;border-radius:999px;background:#FF9A83;color:#0A2240;font-size:15px;font-weight:600;cursor:pointer\" style-hover=\"background:#F0806A;transform:translateY(-1px);box-shadow:0 6px 16px rgba(255,154,131,.35)\" style-active=\"transform:scale(.97)\">{{ mCta }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fform>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ hasToast }}\">\n  <div style=\"position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#0A2240;color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;z-index:70;box-shadow:0 10px 30px rgba(18,32,63,.25);display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px)\"><span style=\"width:7px;height:7px;border-radius:50%;background:#7DE8B8;flex:none\"><\u002Fspan>{{ toast }}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startScreen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;login&quot;,&quot;app&quot;],&quot;default&quot;:&quot;login&quot;,&quot;tsType&quot;:&quot;'login'|'app'&quot;},&quot;startRole&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;admin&quot;,&quot;viewer&quot;,&quot;liaison&quot;],&quot;default&quot;:&quot;admin&quot;,&quot;tsType&quot;:&quot;'admin'|'viewer'|'liaison'&quot;},&quot;vertical&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;education&quot;,&quot;workplace&quot;],&quot;default&quot;:&quot;education&quot;,&quot;tsType&quot;:&quot;'edu
