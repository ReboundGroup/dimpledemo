document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n;scrollbar-color:rgba(255,255,255,.3) transparent\">\n<sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"8\">\n<button sc-camel-on-click=\"{{ n.go }}\" aria-current=\"{{ n.current }}\" style=\"background:none;border:none;border-bottom:3px solid {{ n.border }};cursor:pointer;padding:3px 11px 0;min-height:64px;font-size:14px;white-space:nowrap;color:{{ n.color }};font-weight:{{ n.weight }};display:flex;align-items:center;gap:8px\">{{ n.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fnav>\n<button data-m-signout=\"\" sc-camel-on-click=\"{{ signOut }}\" style=\"flex:none;min-height:36px;padding:0 14px;border:none;border-radius:999px;background:#E8604A;color:#0A2240;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap\">Sign out<\u002Fbutton>\n<\u002Fdiv>\n<div data-m-util=\"\" style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding:10px 24px;background:#EFEAE0;border-bottom:1px solid #E2DBCD;font-size:13px;color:#0A2240\">\n<div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\"><span style=\"font-weight:700\">Acting as<\u002Fspan>\n<div role=\"radiogroup\" aria-label=\"Acting as\" style=\"display:flex;gap:2px;padding:3px;background:#fff;border:1px solid #E2DBCD;border-radius:999px\">\n<sc-for list=\"{{ roles }}\" as=\"r\" hint-placeholder-count=\"2\"><button role=\"radio\" aria-checked=\"{{ r.on }}\" sc-camel-on-click=\"{{ r.pick }}\" style=\"border:none;border-radius:999px;padding:0 14px;min-height:32px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;background:{{ r.bg }};color:{{ r.fg }}\">{{ r.name }}<\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<span style=\"color:#3E4C63\">{{ userRole }}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;color:#3E4C63\"><span data-m-hide=\"\">All activity in this portal is logged<\u002Fspan>\n<button sc-camel-on-click=\"{{ goApprovals }}\" style=\"min-height:32px;padding:0 12px;borde ers appear only as pseudonym handles.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fheader>\n\n<main data-m-main=\"\" style=\"flex:1;width:100%;max-width:1440px;margin:0 auto;padding:28px 24px 64px;box-sizing:border-box;display:flex;flex-direction:column;gap:20px\">\n\n<sc-if value=\"{{ isOverview }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap\">\n<div style=\"display:flex;flex-direction:column;gap:6px\"><h1 style=\"margin:0;font:400 34px/1.1 'DM Serif Display',serif\">Overview<span style=\"color:#E8604A\">.<\u002Fspan><\u002Fh1><div style=\"font-size:15px;color:#4A5A72\">Andhra Pradesh Schools Pilot · India deployment (ap-south-1)<\u002Fdiv><\u002Fdiv>\n<span style=\"display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:#E3EAF5\"><i class=\"icon-scroll-text\"><\u002Fi>This view is logged<\u002Fspan>\n<\u002Fdiv>\n<sc-if value=\"{{ monOpen }}\" hint-placeholder-val=\"{{ true }}\">\n<div role=\"status\" style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#FFF0C7;border:1px solid #D9B44A;border-radius:8px;padding:14px 18px\">\n<i class=\"icon-triangle-alert\" style=\"font-size:20px;color:#6B4A00\"><\u002Fi>\n<div style=\"flex:1;min-width:240px;color:#6B4A00\"><div style=\"font-weight:700;font-size:15px\">Monitoring alert · Check-in sync latency high in Visakhapatnam pool<\u002Fdiv><div style=\"font-size:13px\">p95 2.4 s against a 1.5 s threshold for 18 minutes · source: platform monitoring<\u002Fdiv><\u002Fdiv>\n<button sc-camel-on-click=\"{{ ackMon }}\" style=\"min-height:40px;padding:0 14px;border-radius:8px;border:1px solid #6B4A00;background:transparent;color:#6B4A00;font-weight:600;font-size:14px\">Acknowledge<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<section style=\"display:flex;flex-direction:column;gap:10px\">\n<div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap\"><h2 style=\"margin:0;font-size:13px;letter-spacing:.12em;text-transform:uppercase\">Platform health<\u002Fh2><span style=\"font-size:12px;color:#4A5A72\">From platform monitoring · updated 1 min ago<\u002Fspan><\u002Fdiv>\n<div data-m-2col=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px\">\n<sc-for list=\"{{ health }}\" as=\"h\" hint-placeholder-count=\"4\">\n<div style=\"background:#FFFFFF;border:1px solid #E2DACB;border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px\">\n<div style=\"display:flex;justify-content:space-between;gap:4px 8px;font-size:13px;color:#4A5A72;flex-wrap:wrap\"><span>{{ h.label }}<\u002Fspan><span style=\"display:flex;align-items:center;gap:6px;font-weight:600;color:{{ h.fg }}\"><span style=\"width:8px;height:8px;border-radius:50%;background:{{ h.fg }}\"><\u002Fspan>{{ h.state }}<\u002Fspan><\u002Fdiv>\n<div style=\"font-size:26px;font-weight:600;letter-spacing:-.01em\">{{ h.value }}<\u002Fdiv>\n<div style=\"font-size:12px;color:#4A5A72\">{{ h.meta }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n<div data-m-1col=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px\">\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n<div style=\"background:#FFFFFF;border:1px solid #E2DACB;border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:13px;color:#4A5A72\">Active organisations<\u002Fspan><span style=\"font-size:36px;font-weight:600\">{{ activeOrgs }}<\u002Fspan><span style=\"font-size:12px;color:#4A5A72\">{{ orgCount }} in programme<\u002Fspan><\u002Fdiv>\n<div style=\"background:#FFFFFF;border:1px solid #E2DACB;border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:13px;color:#4A5A72\">Total members<\u002Fspan><span style=\"font-size:36px;font-weight:600\">{{ memberTotal }}<\u002Fspan><span style=\"font-size:12px;color:#4A5A72\">{{ licTotal }} licences allocated<\u002Fspan><\u002Fdiv>\n<div style=\"grid-column:1 / -1;background:#FFFFFF;border:1px solid #E2DACB;border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap\"><span style=\"font-size:15px;font-weight:600\">Open crisis requests by tier<\u002Fspan><span style=\"font-size:12px;color:#4A5A72\">Counts only<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px\">\n<sc-for list=\"{{ tiers }}\" as=\"t\" hint-placeholder-count=\"3\">\n<div style=\"border-radius:8px;padding:12px;background:{{ t.bg }};color:{{ t.fg }};display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase\">{{ t.label }}<\u002Fspan><span style=\"font-size:30px;font-weight:700\">{{ t.n }}<\u002Fspan><span style=\"font-size:12px\">{{ t.sub }}<\u002Fspan><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font-size:12px;color:#4A5A72\">Case detail is visible only to assigned clinicians in In Counsel.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#FFFFFF;border:1px solid #E2DACB;border-radius:8px;display:flex;flex-direction:column\">\n<div style=\"padding:16px 18px;border-bottom:1px solid #E2DACB;display:flex;justify-content:space-between;gap:8px\"><span style=\"font-size:15px;font-weight:600\">Alerts<\u002Fspan><span style=\"font-size:13px;color:#4A5A72\">{{ alertCount }} open<\u002Fspan><\u002Fdiv>\n<sc-for list=\"{{ alerts }}\" as=\"a\" hint-placeholder-count=\"3\">\n<button sc-camel-on-click=\"{{ a.go }}\" style=\"display:flex;align-items:flex-start;gap:12px;padding:14px 18px;border:none;border-bottom:1px solid #EFEAE0;background:transparent;text-align:left;width:100%\" style-hover=\"background:#FAF7F2\">\n<span style=\"width:32px;height:32px;flex:none;border-radius:8px;display:grid;place-items:ce :12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#4A5A72\">{{ p.typeLabel }}<\u002Fspan>\n<span style=\"font-size:16px;font-weight:600\">{{ p.title }}<\u002Fspan>\n<span style=\"font-size:14px\">{{ p.detail }}<\u002Fspan>\n<span style=\"font-size:13px;color:#4A5A72\">Requested by {{ p.reqName }} · {{ p.at }}<\u002Fspan>\n<\u002Fdiv>\n<span style=\"display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;background:#E3EAF5\"><i class=\"icon-clock\"><\u002Fi>Awaiting {{ p.approverName }}<\u002Fspan>\n<sc-if value=\"{{ p.canAct }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;gap:8px\"><button sc-camel-on-click=\"{{ p.reject }}\" style=\"min-height:40px;padding:0 14px;border-radius:8px;border:1px solid #B23A24;background:#FFFFFF;color:#B23A24;font-weight:600\">Reject<\u002Fbutton><button sc-camel-on-click=\"{{ p.approve }}\" style=\"min-height:40px;padding:0 16px;border-radius:8px;border:none;background:#0A2240;color:#FFFFFF;font-weight:600\">Approve<\u002Fbutton><\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ p.cannot }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:13px;max-width:240px;color:#4A5A72\">You requested this. Switch to {{ p.approverName }} to approve.<\u002Fspan><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isOrgs }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap\">\n<div style=\"display:flex;flex-direction:column;gap:6px\"><h1 style=\"margin:0;font:400 34px/1.1 'DM Serif Display',serif\">Programmes &amp; organisations<span style=\"color:#E8604A\">.<\u002Fspan><\u002Fh1><div style=\"font-size:15px;color:#4A5A72\">Deployment → programme → organisation → org units.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\"><span style=\"display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:#E3EAF5\"><i class=\"icon-scroll-text\"><\u002Fi>This view is logged<\u002Fspan><button sc-camel-on-click=\"{{ openWiz }}\" style=\"display:flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;border:none;background:#0A2240;color:#FFFFFF;font-weight:600;font-size:14px\"><i class=\"icon-plus\"><\u002Fi>Onboard school<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<div data-m-crumbs=\"\" style=\"display:flex;align-items:stretch;gap:8px;flex-wrap:wrap\">\n<div style=\"background:#0A2240;color:#FAF7F2;border-radius:8px;padding:14px 18px;display:flex;flex-direction:column;gap:2px;min-width:180px\"><span style=\"font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#E8604A\">Deployment<\u002Fspan><span style=\"font-size:17px;font-weight:600\">India<\u002Fspan><span style=\"font-size:12px\">ap-south-1 · Mumbai<\u002Fspan><\u002Fdiv>\n<i class=\"icon-chevron-right\" style=\"align-self:center;font-size:18px\"><\u002Fi>\n<div style=\"background:#FFFFFF;border:1px solid #E2DACB;border-radius:8px;padding:14px 18px;display:flex;flex-direction:column;gap:2px;min-width:220px\"><span style=\"font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#4A5A72\">Programme<\u002Fspan><span style=\"font-size:17px;font-weight:600\">Andhra Pradesh Schools Pilot<\u002Fspan><span style=\"font-size:12px;color:#4A5A72\">Education vertical · AP jurisdiction<\u002Fspan><\u002Fdiv>\n<i class=\"icon-chevron-right\" style=\"align-self:center;font-size:18px\"><\u002Fi>\n<div style=\"background:#FFFFFF;border:1px solid #E2DACB;border-radius:8px;padding:14px 18px;display:flex;flex-direction:column;gap:2px;min-width:220px\"><span style=\"font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#4A5A72\">Organisations<\u002Fspan><span style=\"font-size:17px;font-weight:600\">{{ orgCount }} schools · {{ memberTotal }} members< ne-height:1.5\">For security, you'll be signed out in <strong style=\"font-variant-numeric:tabular-nums\">{{ idleLeft }} seconds<\u002Fstrong> because there's been no activity.<\u002Fspan>\n<div style=\"display:flex;gap:10px\"><button sc-camel-on-click=\"{{ signOut }}\" style=\"flex:1;min-height:44px;border-radius:8px;border:1px solid #0A2240;background:#FFFFFF;font-weight:600\">Sign out now<\u002Fbutton><button sc-camel-on-click=\"{{ stay }}\" style=\"flex:1;min-height:44px;border-radius:8px;border:none;background:#0A2240;color:#FFFFFF;font-weight:600\">Stay signed in<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ toastOn }}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;background:#0A2240;color:#FFFFFF;padding:12px 18px;border-radius:8px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(10,34,64,.25);max-width:90vw\"><i class=\"icon-circle-check\" style=\"color:#7DE8B8\"><\u002Fi>{{ toast }}<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst PEOPLE = { admin: { name: 'Ravi Iyer', role: 'Platform admin' }, approver: { name: 'Dr. Meera Nair', role: 'Second approver · Clinical Director' } };\nconst PILL = { ok: ['#DFF5EA', '#0B5D3B'], warn: ['#FFF0C7', '#6B4A00'], pend: ['#E3EAF5', '#0A2240'], bad: ['#FBE1DA', '#9E2A16'], neu: ['#EFEAE0', '#0A2240'] };\nconst pill = k => ({ bg: PILL[k][0], fg: PILL[k][1] });\nconst nf = n => Number(n).toLocaleString('en-IN');\nconst fmt = d => d.toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }).replace(',', ' ·');\nconst TODAY = new Date('2026-10-27T00:00:00');\nconst units = (m, names) => { const n = names || ['Class 8', 'Class 9', 'Class 10']; let left = m; return n.map((name, i) => { const v = i == perations → Platform admin', tr('Anil Kumar', '26 Oct 2026 · 11:40', 'Ravi Iyer', '26 Oct 2026 · 11:52')],\n  ['25 Oct 2026 · 19:22', 'System', 'Identity', 'Sign-in', 'Failed sign-in · unregistered device', 'Blocked: passkey not registered · VPN 10.8.0.41', null, true],\n  ['25 Oct 2026 · 15:10', 'Bhavani Reddy', 'Counsellor · Tirupati', 'Case opening', 'Case TPT-0233 · Teja-19', 'Tier 3 · ZPHS Renigunta'],\n  ['24 Oct 2026 · 10:03', 'Dr. Meera Nair', 'Clinical Director', 'Liaison-contact view', 'Liaison contact for Meena-31', 'Tier 1 clinical review'],\n  ['22 Oct 2026 · 09:30', 'Sunita Reddy', 'Operations', 'Sign-in', 'Dimple Control', 'Google SSO + passkey · VPN 10.8.0.30'],\n  ['12 Oct 2026 · 14:20', 'Ravi Iyer', 'Platform admin', 'Configuration change', 'Caseload cap', '55 → 60 cases · v14', tr('Ravi Iyer', '11 Oct 2026 · 17:02', 'Dr. Meera Nair', '12 Oct 2026 · 14:20')],\n  ['03 Oct 2026 · 22:41', 'Anil Kumar', 'Operations', 'Break-glass', 'Platform configuration (write)', '30 min session · expired automatically', tr('Anil Kumar', '03 Oct 2026 · 22:38', 'Ravi Iyer', '03 Oct 2026 · 22:41'), true]\n].map((r, i) => ({ id: 'A-' + (2410 - i), t: r[0], actor: r[1], role: r[2], action: r[3], target: r[4], detail: r[5], trail: r[6] || null, flagged: !!r[7] }));\nconst SCOPES = ['Platform configuration (write)', 'Practitioner accounts (write)', 'Org admin console · ZPHS Gajuwaka'];\n\nclass Component extends DCLogic {\n  state = {\n    role: 'admin', screen: 'overview', toast: '', signedOut: true, loginEmail: 'ravi.iyer@dimple.in', loginPw: 'dimple-demo', loginErr: '', loginNotice: '', idle: false, idleEnds: 0,\n    orgs: ORGS, open: {}, wiz: null, wizErr: '',\n    vSaved: EDU, vDraft: EDU, vRes: null, vVer: 7, vPending: false,\n    pracs: PRACS, pPool: 'All', pRole: 'All roles', pq: '', pForm: null, pErr: '',\n    cfg: CFG, cfgVer: 14, cfgEdit: null, cfgVal: '', cfgErr: '',\n    versions: [{ v: 14, at: '12 Oct 2026', what: 'Active cases per counsellor 55 → 60', by: 'Ravi Iyer', ap: 'Dr. Meera Nair' }, { v: 13, at: '28 Sep 2026', what: 'Tier 3 threshold 9 → 8 pts', by: 'Dr. Meera Nair', ap: 'Ravi Iyer' }, { v: 12, at: '02 Sep 2026', what: 'Initial pilot configuration', by: 'Ravi Iyer', ap: 'Dr. Meera Nair' }],\n    pend: [{ id: 'q1', type: 'cfg', key: 'e2', to: 20, title: 'Escalation timer · Tier 2 response', detail: '30 min → 20 min', requester: 'admin', reqName: 'Ravi Iyer', at: '26 Oct 2026 · 16:05', approverName: 'Dr. Meera Nair', auditId: 'A-2406' }],\n    audit: AUDIT, aq: '', aUser: 'All users', aAction: 'All actions', aFlag: false, aSel: null,\n    monAck: false, extraAlerts: [],\n    bg: { status: 'none', scope: SCOPES[0], reason: '', err: '' },\n    bgHist: [{ who: 'Anil Kumar', when: '03 Oct 2026 · 22:41', scope: 'Platform configuration (write)', dur: '30 min · expired automatically', approver: 'Ravi Iyer', reason: 'Escalation timers misfiring during exam week; config hotfix needed' }]\n  };\n  componentDidMount() {\n    this.last = Date.now();\n    this.bump = () => { this.last = Date.now(); };\n    ['mousemove', 'keydown', 'click'].forEach(e => window.addEventListener(e, this.bump));\n    this.timer = setInterval(() => this.tick(), 1000);\n  }\n  componentWillUnmount() { clearInterval(this.timer); ['mousemove', 'keydown', 'click'].forEach(e => window.removeEventListener(e, this.bump)); }\n  tick() {\n    const s = this.state, now = Date.now();\n    if (s.signedOut) return;\n    if (s.idle) { if (now >= s.idleEnds) this.setState({ idle: false, signedOut: true, loginNotice: 'You were signed out after a period of inactivity. Your session end was logged.' }); else this.forceUpdate(); }\n    else if (now - this.last > 10 * 60 * 1000) this.setState({ idle: true, idleEnds: now + 60000 });\n    if (s.bg.status === 'active') { if (now >= s.bg.endsAt) this.expireBg('expired automatically'); else this.forceUpdate(); }\n  }\n  me() { return PEOPLE[this.state.role]; }\n  say(t) { clearTimeout(this.tt); this.setState({ toast: t })
